<h2>Dashboard</h2>

<p>Welcome to PolicyHub Dashboard</p>

<div class="dashboard">

  <div class="card">
    <h3>Total Policies</h3>
    <p>{{ totalPolicies }}</p>
  </div>

  <div class="card">
    <h3>Active Policies</h3>
    <p>{{ activePolicies }}</p>
  </div>

  <div class="card">
    <h3>Expired Policies</h3>
    <p>{{ expiredPolicies }}</p>
  </div>

  <div class="card">
    <h3>Cancelled Policies</h3>
    <p>{{ cancelledPolicies }}</p>
  </div>

</div>
